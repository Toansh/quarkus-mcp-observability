quarkus.application.name=quarkus-mcp-observability
quarkus.application.version=1.0.0-SNAPSHOT

quarkus.http.port=8080
quarkus.http.cors.enabled=false

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mcp
quarkus.datasource.password=mcp
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mcp

# Flyway owns the schema. Hibernate is read/write only — never generates DDL.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."io.github.toansh".level=DEBUG
