quarkus.application.name=quarkus-mcp-observability
quarkus.application.version=1.0.0-SNAPSHOT

quarkus.http.port=8080
quarkus.http.cors.enabled=false

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=mcp
quarkus.datasource.password=mcp
# URL is profile-scoped on purpose: the test profile leaves it unset so Quarkus Dev Services
# provisions a throw-away Postgres. Dev points at the local compose stack; prod is overridden
# via env (e.g. QUARKUS_DATASOURCE_JDBC_URL) at deploy time.
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mcp
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mcp

# Flyway owns the schema. Hibernate is read/write only — never generates DDL.
quarkus.hibernate-orm.database.generation=none
# JSONB columns (AuditLog.args) are a plain Map passthrough; we don't customize JSON
# (de)serialization, so opt out of Quarkus' format mapper. Becomes the default in a future release.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# --- Prometheus REST client ---
# Override prometheus.url to point at a real instance; the REST client URL resolves from it.
prometheus.url=http://localhost:9090
quarkus.rest-client.prometheus-api.url=${prometheus.url}
quarkus.rest-client.prometheus-api.connect-timeout=2000
quarkus.rest-client.prometheus-api.read-timeout=5000

# query_prometheus tool: hard cap on result series. See PrometheusTool.
prometheus.tool.max-series=1000
# query_prometheus_range tool: hard cap on total samples (series x points). See PrometheusRangeTool.
prometheus.tool.range.max-samples=11000

# --- Per-client rate limiting ---
# Token bucket per API-key principal. requests-per-minute is the sustained refill rate;
# burst is the bucket capacity (max requests in a spike). Over-limit -> HTTP 429 + Retry-After.
mcp.rate-limit.enabled=true
mcp.rate-limit.requests-per-minute=60
mcp.rate-limit.burst=20

# --- OAuth2 / OIDC & Security Configuration ---
# By default OIDC is disabled (quarkus.oidc.enabled=false) so the server works out-of-the-box
# with static API keys in dev and test. To enable OIDC in production, set QUARKUS_OIDC_ENABLED=true
# and configure QUARKUS_OIDC_AUTH_SERVER_URL and QUARKUS_OIDC_CLIENT_ID.
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false
# Set proactive=false so non-JWT bearer tokens (like mcp_* static keys) are not rejected by OIDC
# before reaching our hybrid auth filter.
quarkus.http.auth.proactive=false

%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."io.github.toansh".level=DEBUG
