# Test profile overrides. Datasource is intentionally NOT configured here so Quarkus
# Devservices spins up a throw-away Postgres container per `mvn test` run.

# Devservices: pin the Postgres image so test runs are reproducible.
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Tests don't talk to a real Prometheus; point the rest client at an unreachable port
# so any accidental call surfaces fast.
prometheus.url=http://localhost:1
quarkus.rest-client.prometheus-api.connect-timeout=500
quarkus.rest-client.prometheus-api.read-timeout=500

# Rate limiting stays ON in tests (so the filter path is exercised) but with a generous
# limit the normal suites can't trip. RateLimitTest overrides this with a tiny burst via
# its own @TestProfile to assert the 429 path in isolation.
mcp.rate-limit.requests-per-minute=100000
mcp.rate-limit.burst=100000

# Less log noise during tests.
quarkus.log.category."io.github.toansh".level=INFO
